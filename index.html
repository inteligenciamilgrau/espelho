<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogo</title>
<!-- O navegador só desenha esta página depois de chegar ao fim dela (o elemento #pronta, lá embaixo), ou seja, com o
     cenário já montado pelos scripts. Junto com a transição de página (@view-transition, no estilo), é o que faz a
     página anterior ficar na tela até esta ter o que mostrar: sem tela preta ao voltar um ponto numa gravação ou ao
     começar outro desafio. (O navegador que não conhece isto desenha como sempre.) -->
<link rel="expect" href="#pronta" blocking="render">
<!-- ícone da aba: o rosto do robô, desenhado em SVG aqui mesmo (funciona sem servidor) -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cline x1='42' y1='17' x2='42' y2='7' stroke='%232c333b' stroke-width='3'/%3E%3Ccircle cx='42' cy='7' r='5' fill='%23ff8a3d'/%3E%3Crect x='7' y='17' width='50' height='40' rx='10' fill='%23e6eaee' stroke='%232c333b' stroke-width='3'/%3E%3Crect x='14' y='27' width='36' height='18' rx='6' fill='%232c333b'/%3E%3Ccircle cx='24' cy='36' r='5' fill='%234fe3ff'/%3E%3Ccircle cx='40' cy='36' r='5' fill='%234fe3ff'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  /* (o canvas enche a janela; nos desafios, com o menu ao lado, jogo.js diz onde a imagem fica: ver "a tela cheia e o menu ao lado") */
  canvas { display: block; position: fixed; left: var(--tela-x, 0px); top: var(--tela-y, 0px); width: var(--tela-l, 100vw); height: var(--tela-a, 100vh); }
  [hidden] { display: none !important; }
  /* Ao trocar de página dentro do jogo, a velha fica na tela até a nova estar pronta, e a troca é de uma vez (sem esmaecer). */
  @view-transition { navigation: auto; }
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
  ::view-transition-old(*) { display: none; }
  #doca, #pilulas { display: contents; }
  .painel {
    position: fixed; padding: 10px 12px; border-radius: 8px;
    background: rgba(10, 14, 18, .62); color: #e8eef2;
    font: 13px/1.5 Consolas, "Cascadia Mono", monospace; white-space: pre;
    pointer-events: none; user-select: none;
  }
  #ajuda  { top: 12px; left: 12px; }
  #status { top: 48px; right: 12px; text-align: right; }
  #replays { top: 12px; right: 12px; pointer-events: auto; color: #7dffb0; text-decoration: none; }
  #replays:hover { text-decoration: underline; }
  #quer { bottom: 12px; left: 50%; transform: translateX(-50%); width: min(58vw, 780px); box-sizing: border-box; white-space: normal; }
  #log    { bottom: 12px; left: 12px; min-width: 260px; }
  #log .ultima { color: #7dffb0; }
  #modo   { bottom: 52px; right: 12px; background: rgba(150, 60, 0, .8); font-weight: bold; }
  #ponte  { bottom: 12px; right: 12px; font-size: 12px; color: #9fb0ba; text-align: right; }
  #ponte.alerta { background: rgba(150, 30, 20, .9); color: #fff; font-size: 14px; font-weight: bold; }
  #vista  { bottom: 92px; right: 12px; pointer-events: auto; }
  #mensagem { bottom: 12px; left: 12px; }
  #caixa {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    padding: 18px 20px; border-radius: 10px; background: rgba(10, 14, 18, .92);
    color: #e8eef2; font: 14px/1.6 Consolas, "Cascadia Mono", monospace; text-align: center;
  }
  #caixa input {
    display: block; margin: 8px auto; width: 11ch; padding: 6px 10px;
    font: bold 22px Consolas, "Cascadia Mono", monospace; letter-spacing: 2px; text-align: center;
    color: #5dffa0; background: #06120c; border: 2px solid #2a6b48; border-radius: 6px; outline: none;
  }
  #caixa small { color: #9fb0ba; }

  /* ---------- a cara dos desafios 1 a 3 ----------
     jogo.js põe a classe "desafio" no body; a quadra (arena.js) continua com o estilo de cima.
     Tudo aqui é da página, não do jogo: nada disto entra na imagem que a iA recebe.
     As fontes são as que já vêm no Windows (nada é baixado): Bahnschrift nos títulos, Segoe UI
     no texto e Cascadia Mono nas teclas e nos números. */
  body.desafio {
    --texto: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --titulo: Bahnschrift, "Segoe UI Variable Display", "Segoe UI", system-ui, Arial, sans-serif;
    --mono: "Cascadia Mono", "Cascadia Code", Consolas, monospace;
    --vidro: rgba(17, 22, 29, .7);
    --borda: rgba(255, 255, 255, .13);
    --apagado: #93a4af;
    --verde: #7dffb0;
    --laranja: #ff9a56;
  }
  body.desafio .painel, body.desafio #caixa, body.desafio .gravacao {
    border-radius: 14px; border: 1px solid var(--borda);
    background: var(--vidro);
    box-shadow: 0 12px 32px rgba(0, 0, 0, .34), inset 0 1px 0 rgba(255, 255, 255, .07);
    -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3);
    color: #eef3f6; font: 14px/1.5 var(--texto); letter-spacing: .1px;
  }
  body.desafio .painel { padding: 10px 14px; }
  /* uma tecla */
  body.desafio kbd {
    display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box;
    min-width: 28px; height: 28px; padding: 0 8px; margin: 2px; border-radius: 7px;
    font: 600 12.5px/1 var(--mono); color: #f4f7f9;
    background: linear-gradient(#3b4651, #262e37);
    border: 1px solid rgba(255, 255, 255, .17); border-bottom: 3px solid rgba(0, 0, 0, .5);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1);
  }
  /* a lista de teclas: em cima as do jogo, arrumadas como no teclado; embaixo as da página */
  body.desafio #ajuda { top: 14px; left: 14px; white-space: normal; padding: 12px 12px 10px; }
  body.desafio #ajuda .fileira { display: flex; justify-content: center; }
  body.desafio #ajuda .da-pagina { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--borda); }
  body.desafio #ajuda .da-pagina::before { content: 'da página'; display: block; margin: 0 2px 4px; font: 600 10px/1 var(--titulo); letter-spacing: 1.5px; text-transform: uppercase; color: var(--apagado); }
  body.desafio #ajuda .da-pagina .fileira { justify-content: flex-start; }
  body.desafio #ajuda .da-pagina kbd { min-width: 23px; height: 23px; padding: 0 6px; font-size: 11px; color: #c5d0d8; background: rgba(255, 255, 255, .07); border-bottom-width: 2px; }
  /* o que o jogo disse ao jogador */
  body.desafio #mensagem { bottom: 14px; left: 14px; padding: 9px 15px 10px; font-size: 15px; font-weight: 600; white-space: normal; box-sizing: border-box; max-width: calc(21vw - 28px); }
  body.desafio #mensagem::before { content: 'o jogo disse'; display: block; margin-bottom: 2px; font: 600 10px/1.2 var(--titulo); letter-spacing: 1.5px; text-transform: uppercase; color: var(--apagado); }
  /* quem está jogando (nome e modelo) e o que diz que pretende com cada botão */
  body.desafio #quer { bottom: 14px; padding: 12px 16px 13px; }
  body.desafio #quer .quem { display: flex; align-items: center; gap: 10px; }
  body.desafio #quer .quem:not(:last-child) { margin-bottom: 9px; padding-bottom: 10px; border-bottom: 1px solid var(--borda); }
  body.desafio #quer .quem::before { content: ''; flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--laranja); box-shadow: 0 0 0 4px rgba(255, 154, 86, .22); }
  body.desafio #quer .quem b { font: 700 21px/1.1 var(--titulo); letter-spacing: .4px; color: var(--laranja); }
  body.desafio #quer .quem span { font: 600 12px/1 var(--texto); color: #e2eaef; padding: 5px 10px; border-radius: 999px; background: rgba(255, 255, 255, .09); border: 1px solid var(--borda); }
  body.desafio #quer .quem span:empty { display: none; }
  body.desafio #quer .titulo { margin: 0 0 5px; font: 600 10px/1 var(--titulo); letter-spacing: 1.6px; text-transform: uppercase; color: var(--apagado); }
  body.desafio #quer .linha { display: flex; align-items: baseline; gap: 9px; padding: 2px 0; font-size: 13.5px; color: #b3c1ca; }
  body.desafio #quer .linha b { flex: none; min-width: 26px; padding: 4px 6px; border-radius: 6px; text-align: center; font: 600 11px/1 var(--mono); color: #d7e0e6; background: rgba(255, 255, 255, .09); }
  body.desafio #quer .linha:nth-last-child(4) { opacity: .5; }
  body.desafio #quer .linha:nth-last-child(3) { opacity: .68; }
  body.desafio #quer .linha:nth-last-child(2) { opacity: .86; }
  body.desafio #quer .ultima { margin-top: 3px; font-size: 17px; font-weight: 600; line-height: 1.35; color: #ffffff; animation: chegou .28s ease-out; }
  body.desafio #quer .ultima b { color: #07130d; background: var(--verde); font-size: 12px; }
  @keyframes chegou { from { opacity: 0; transform: translateY(7px); } }
  /* o atalho dos replays e o estado da ligação com o MCP */
  /* o canto de cima, à direita, é do indicador dos alvos (desenhado no jogo): os replays ficam embaixo, e o aviso do MCP em cima deles */
  body.desafio #replays { top: auto; bottom: 14px; right: 14px; padding: 8px 15px; border-radius: 999px; font: 600 13px/1 var(--texto); color: var(--verde); transition: background .15s, color .15s; }
  body.desafio #replays:hover { text-decoration: none; background: var(--verde); color: #07130d; }
  body.desafio #ponte { bottom: 98px; right: 14px; padding: 8px 14px; border-radius: 999px; font-size: 12.5px; color: #c9d4db; text-align: left; }
  body.desafio #ponte::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--verde); box-shadow: 0 0 0 3px rgba(125, 255, 176, .2); }
  body.desafio #ponte.alerta { border-radius: 14px; background: rgba(170, 36, 28, .92); border-color: rgba(255, 255, 255, .25); color: #fff; font-size: 14px; font-weight: 600; }
  body.desafio #ponte.alerta::before { background: #fff; box-shadow: none; }
  /* a visão de quem assiste: dois botões numa pílula, o aceso é a visão atual (tecla C); e o arranjo da página, do mesmo jeito (tecla B) */
  body.desafio #vista, body.desafio #arranjo { bottom: 54px; right: 14px; padding: 4px; border-radius: 999px; display: flex; align-items: center; gap: 2px; white-space: nowrap; pointer-events: auto; }
  body.desafio #vista button, body.desafio #arranjo button { all: unset; cursor: pointer; padding: 6px 12px; border-radius: 999px; font: 600 12.5px/1 var(--texto); color: #c9d4db; transition: background .15s, color .15s; }
  body.desafio #vista button:hover, body.desafio #arranjo button:hover { color: #fff; }
  body.desafio #vista button.acesa, body.desafio #arranjo button.acesa { background: var(--verde); color: #07130d; }
  body.desafio #vista kbd, body.desafio #arranjo kbd { min-width: 22px; height: 22px; padding: 0 6px; margin: 0 4px 0 5px; font-size: 11px; }
  /* o som dos desafios: uma pílula que liga e desliga (tecla O) */
  body.desafio #som { bottom: 140px; right: 14px; padding: 4px; border-radius: 999px; display: flex; align-items: center; white-space: nowrap; pointer-events: auto; }
  body.desafio #som button { all: unset; cursor: pointer; padding: 6px 12px; border-radius: 999px; font: 600 12.5px/1 var(--texto); color: #c9d4db; transition: background .15s, color .15s; }
  body.desafio #som button.acesa { background: var(--verde); color: #07130d; }
  body.desafio #som kbd { min-width: 22px; height: 22px; padding: 0 6px; margin: 0 4px 0 5px; font-size: 11px; }
  body.desafio #som label { display: flex; align-items: center; gap: 6px; margin: 0 8px 0 6px; font: 600 11.5px/1 var(--texto); color: #c9d4db; }
  body.desafio #som input[type=range] { width: 72px; margin: 0; accent-color: var(--verde); cursor: pointer; }
  /* no modo voador: as teclas de quem voa no lugar das do jogo, e o balão do que a iA pretende, em cima da cabeça do robô */
  body.desafio #ajuda .do-voador::before { content: 'voador'; display: block; margin: 0 2px 4px; text-align: center; font: 600 10px/1 var(--titulo); letter-spacing: 1.5px; text-transform: uppercase; color: var(--verde); }
  body.desafio #ajuda .do-voador .dica { margin: 5px auto 0; max-width: 168px; text-align: center; font: 11px/1.4 var(--texto); color: var(--apagado); }
  body.desafio:not(.voando) #ajuda .do-voador, body.desafio.voando #ajuda .do-jogo { display: none; }
  body.desafio #pensa {
    position: fixed; left: 0; top: 0; max-width: 300px; box-sizing: border-box; padding: 9px 13px 10px; border-radius: 16px;
    background: #fff; color: #14181d; font: 600 14.5px/1.3 var(--texto); white-space: normal; overflow-wrap: anywhere;
    box-shadow: 0 8px 26px rgba(0, 0, 0, .4); pointer-events: none; user-select: none;
    transform-origin: var(--rabo, 50%) calc(100% + 26px); will-change: transform;
  }
  /* (--rabo: onde o balão se prende à cabeça do robô, ao longo da largura dele: no meio ou, na visão por trás, perto de uma das pontas: ver porPensamento, em jogo.js) */
  body.desafio #pensa::before, body.desafio #pensa::after { content: ''; position: absolute; left: var(--rabo, 50%); border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, .3); }
  body.desafio #pensa::before { bottom: -14px; width: 12px; height: 12px; margin-left: -10px; }
  body.desafio #pensa::after { bottom: -25px; width: 7px; height: 7px; margin-left: -2px; }
  body.desafio #pensa b { display: inline-block; margin-right: 7px; padding: 2px 6px; border-radius: 6px; background: #14181d; color: #fff; font: 700 10.5px/1.4 var(--mono); vertical-align: 2px; }
  body.desafio #modo { padding: 6px 13px; border-radius: 999px; background: rgba(190, 86, 10, .9); font: 700 13px/1 var(--mono); }
  /* o painel de depuração (só com ?depurar) fica sempre por cima da imagem, nos cantos dela */
  body.desafio #status { top: calc(var(--tela-y, 0px) + 58px); right: auto; left: calc(var(--tela-x, 0px) + var(--tela-l, 100vw) - 14px); transform: translateX(-100%); font: 12.5px/1.5 var(--mono); }
  body.desafio #log { bottom: calc(100vh - var(--tela-y, 0px) - var(--tela-a, 100vh) + 14px); left: calc(var(--tela-x, 0px) + 14px); font: 12.5px/1.5 var(--mono); }

  /* ---------- a tela cheia e o menu ao lado ----------
     A página dos desafios tem dois arranjos, que quem assiste troca pela tecla B ou pela pílula
     "tela cheia / menu ao lado" (jogo.js: ver "a tela cheia e o menu ao lado").
       tela cheia (body.tela-cheia): a imagem do jogo enche a janela, e os painéis ficam por cima
         dela, de vidro, nos cantos. O campo de quem joga e do que pretende fica no canto de baixo,
         à direita, em cima das pílulas — e não embaixo, no meio, onde tapava o chão.
       menu ao lado (body.bancada): a imagem tem o formato da que a iA recebe e nada fica por cima
         dela; tudo o que é de quem assiste mora na bancada (#doca): uma coluna à esquerda da imagem
         (body.doca-lado) ou, numa janela mais quadrada, uma faixa embaixo dela (body.doca-baixo).
         --doca é a largura da coluna ou a altura da faixa. */
  body.desafio #doca { position: fixed; z-index: 3; box-sizing: border-box; display: flex; pointer-events: none; }
  body.desafio #pilulas { display: flex; gap: 6px; flex: none; }
  body.desafio #pilulas > .painel { position: static; }
  body.desafio #quer { overflow: hidden; overflow-wrap: anywhere; }
  /* o que a iA pretendia com cada botão: a partida inteira, numa caixa que rola (jogo.js: ver acertarRolo). À vista ficam as últimas;
     a roda do mouse e a barra voltam para as de antes. Só a caixa recebe o mouse: o resto do campo deixa o clique passar para o jogo. */
  body.desafio:not(.coletivo) #quer { display: flex; flex-direction: column; }
  body.desafio:not(.coletivo) #quer > * { flex: none; }
  body.desafio #quer .rolo-fora { position: relative; display: flex; flex-direction: column; flex: 0 1 auto; min-height: 0; }
  body.desafio #quer .rolo { position: relative; flex: 0 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; pointer-events: auto;
    margin-right: -9px; padding-right: 3px; scrollbar-width: thin; scrollbar-gutter: stable; scrollbar-color: rgba(255, 255, 255, .3) transparent; }   /* (o lugar da barra fica sempre reservado: as linhas não mudam de largura quando ela aparece) */
  body.desafio #quer .rolo .antiga { opacity: .42; }
  body.desafio #quer .rolo:hover .linha:not(.ultima) { opacity: 1; }   /* (com o mouse em cima, as antigas acendem para a leitura) */
  /* "a mais nova": aparece quando quem assiste subiu para ler as antigas; fica por cima do canto da caixa, sem tomar o lugar das linhas */
  body.desafio #quer .ao-fim { position: absolute; right: 6px; bottom: 2px; padding: 4px 10px; border-radius: 999px; cursor: pointer; pointer-events: auto;
    font: 600 11.5px/1 var(--texto); color: #07130d; background: var(--verde); box-shadow: 0 2px 10px rgba(0, 0, 0, .45); }
  /* tela cheia: uma pilha no canto de baixo, à direita (o campo das intenções em cima, as pílulas embaixo), que só sobe até --teto: o indicador
     do alvo, no alto da imagem, ou o pé da lista de teclas, quando ela está desse lado (jogo.js mede: ver arrumarPaineis) */
  body.desafio.tela-cheia #doca { right: 14px; bottom: 14px; width: min(412px, calc(100vw - 28px)); max-height: calc(100vh - 14px - var(--teto, 14vh)); flex-direction: column; align-items: flex-end; justify-content: flex-end; gap: 8px; }
  body.desafio.tela-cheia #quer { position: static; transform: none; width: 100%; box-sizing: border-box; flex: 0 1 auto; min-height: 0; }
  body.desafio.tela-cheia #quer .ultima { font-size: 15.5px; }
  body.desafio.tela-cheia #pilulas { width: 100%; flex-wrap: wrap; justify-content: flex-end; align-items: center; }   /* (as pílulas em fileiras, da direita para a esquerda: a pilha fica mais baixa) */
  /* (no quebra-cabeça a bandeja das peças fica à direita: lá o campo continua embaixo, no meio, entre o quadro e a bandeja, e menor) */
  body.desafio.tela-cheia.quebra #quer { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(58vw, 780px); zoom: .85; }
  /* Nos zumbis a imagem tem o mapa deles no canto de baixo, à esquerda (38% da altura): o que o jogo disse sobe para cima dele. */
  body.desafio.tela-cheia.zumbis #mensagem { bottom: calc(0.4 * var(--tela-a) + 14px); }
  /* menu ao lado */
  body.desafio.bancada { background: #090c10; }
  body.desafio.bancada #doca { gap: 10px; padding: 14px; overflow: hidden; background: #090c10; }
  body.desafio.bancada #doca > .painel:not(.solta), body.desafio.bancada #pilulas > .painel { position: static; transform: none; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07); }
  body.desafio.bancada #doca > .gravacao { position: static !important; flex: none; pointer-events: auto; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07) !important; }
  body.desafio.bancada #quer { width: auto; }
  /* a coluna: a gravação, quem joga e o que pretende, o que o jogo disse; no pé, as teclas e as pílulas */
  body.desafio.doca-lado #doca { top: 0; left: 0; bottom: 0; width: var(--doca, 340px); flex-direction: column; border-right: 1px solid rgba(255, 255, 255, .08); }
  body.desafio.doca-lado #doca > .gravacao { width: auto !important; }
  body.desafio.doca-lado #quer { flex: 0 1 auto; min-height: 0; }
  body.desafio.doca-lado #mensagem { flex: none; max-width: none; }
  body.desafio.doca-lado #ajuda { flex: none; margin-top: auto; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 12px; align-items: start; padding: 10px 10px 8px; }
  body.desafio.doca-lado #ajuda .da-pagina { margin-top: 0; padding: 0 0 0 12px; border-top: 0; border-left: 1px solid var(--borda); }
  body.desafio.doca-lado #ajuda .da-pagina .fileira { flex-wrap: wrap; }
  body.desafio.doca-lado #ajuda .do-voador .dica { max-width: 132px; }
  body.desafio.doca-lado #pilulas { margin-top: auto; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
  body.desafio.doca-lado #ajuda:not([hidden]) + #pilulas { margin-top: 0; }
  body.desafio.doca-lado #pilulas > .painel { flex: 1 1 auto; box-sizing: border-box; text-align: center; }
  body.desafio.doca-lado #pilulas > #modo { flex: none; }
  body.desafio.doca-lado #vista, body.desafio.doca-lado #arranjo { flex-basis: 100%; justify-content: center; }
  body.desafio.doca-lado #ponte { order: 1; }
  body.desafio.doca-lado #replays { order: 2; }
  body.desafio.doca-lado #quer .ultima { font-size: 15.5px; }
  /* na coluna, o som em duas fileiras: o botão em cima, as réguas embaixo */
  body.desafio.doca-lado #som { display: grid; grid-template-columns: auto minmax(0, 1fr); row-gap: 5px; border-radius: 18px; padding: 5px 6px 8px; }
  body.desafio.doca-lado #som kbd { justify-self: start; }
  body.desafio.doca-lado #som { flex-basis: 100%; }
  body.desafio.doca-lado #som label input[type=range] { flex: 1 1 40px; min-width: 40px; width: auto; }
  /* a faixa: da esquerda para a direita, o que o jogo disse, quem joga e o que pretende, e as pílulas; assistindo a uma
     gravação, o painel dela vem primeiro e o que o jogo disse sobe para cima das pílulas (jogo.js o muda de lugar)
     (aqui a lista de teclas não cabe: fica solta, num canto da imagem em que o jogo não escreve, e o H a guarda) */
  body.desafio.doca-baixo #doca { left: 0; right: 0; bottom: 0; height: var(--doca, 204px); flex-direction: row; align-items: flex-end; border-top: 1px solid rgba(255, 255, 255, .08); }
  body.desafio.doca-baixo #doca > .gravacao { order: -2; }
  body.desafio.doca-baixo #mensagem { order: -1; flex: 0 1 auto; max-width: 210px; }
  body.desafio.doca-baixo #quer { flex: 1 1 0; min-width: 0; max-height: 100%; }
  body.desafio.doca-baixo #pilulas { width: 330px; flex-wrap: wrap; justify-content: flex-end; align-content: flex-end; align-items: center; max-height: 100%; }
  body.desafio.doca-baixo #som label { display: none; }   /* (as réguas de volume não cabem na faixa: ficam na tela cheia e na coluna) */
  body.desafio.doca-baixo #pilulas > #mensagem { max-width: 270px; padding: 7px 13px 8px; }
  /* na vila coletiva são até quatro robôs: na faixa, o campo deles vai em duas colunas */
  body.desafio.doca-baixo.coletivo #quer { column-count: 2; column-gap: 26px; }
  body.desafio.coletivo #quer .quem, body.desafio.coletivo #quer .linha { break-inside: avoid; }
  /* (e o traço fica em cima de cada robô, não embaixo do nome: o que vem depois do nome é dele) */
  body.desafio.coletivo #quer .quem:not(:last-child) { margin-bottom: 3px; padding-bottom: 0; border-bottom: 0; }
  body.desafio.coletivo #quer .quem ~ .quem { margin-top: 8px; padding-top: 9px; border-top: 1px solid var(--borda); }
  @media (max-width: 1150px) { body.desafio.doca-baixo #quer .ultima { font-size: 15.5px; } }

  /* a caixa de digitar o texto do botão T: no meio da imagem */
  body.desafio #caixa { left: calc(var(--tela-x, 0px) + var(--tela-l, 100vw) / 2); top: calc(var(--tela-y, 0px) + var(--tela-a, 100vh) / 2); padding: 18px 22px 16px; background: rgba(17, 22, 29, .88); }
  body.desafio #caixa::before { content: 'texto'; display: block; margin-bottom: 8px; font: 600 10px/1 var(--titulo); letter-spacing: 1.6px; text-transform: uppercase; color: var(--apagado); }
  body.desafio #caixa input {
    margin: 0 auto; width: 11ch; padding: 9px 12px; border-radius: 10px;
    font: 700 24px/1.2 var(--mono); letter-spacing: 3px; color: var(--verde);
    background: rgba(4, 14, 9, .85); border: 2px solid rgba(125, 255, 176, .35);
    transition: border-color .15s, box-shadow .15s;
  }
  body.desafio #caixa input:focus { border-color: var(--verde); box-shadow: 0 0 0 4px rgba(125, 255, 176, .16); }
  /* o painel de quem assiste a uma gravação (gravacao.js monta com estilo próprio: aqui só a cara dos desafios; no menu ao lado, jogo.js o põe na bancada) */
  body.desafio .gravacao { top: 14px !important; left: 14px !important; width: 276px !important; padding: 11px 13px !important; border-radius: 14px !important; background: var(--vidro) !important; font: 13px/1.5 var(--texto) !important; }
  body.desafio .gravacao b { font-family: var(--titulo); letter-spacing: 1px; }

  /* ---------- o menu dos jogos ----------
     Abre sozinho quando a página é aberta sem dizer o jogo (o endereço sem ?desafio=), e pela tecla Esc
     ou pela pílula "jogos". É da página, por cima de tudo: nunca entra na imagem que a iA recebe.
     (Vale também na quadra: por isso não depende das cores e das fontes dos desafios.) */
  #menu { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: rgba(4, 7, 10, .6); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
    font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Arial, sans-serif; color: #eef3f6; user-select: none; }
  #menu .quadro { width: min(780px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; box-sizing: border-box; padding: 16px 20px 13px; border-radius: 16px;
    background: rgba(17, 22, 29, .95); border: 1px solid rgba(255, 255, 255, .14); box-shadow: 0 24px 60px rgba(0, 0, 0, .55); }
  #menu h1 { margin: 0; font: 700 25px/1.1 Bahnschrift, "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; letter-spacing: .5px; }
  #menu .dica { margin: 4px 0 11px; color: #93a4af; }
  #menu .lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 6px; }
  #menu .item { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 7px 12px; border-radius: 10px; cursor: pointer;
    background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .1); transition: background .12s, border-color .12s; }
  #menu .item:hover, #menu .item:focus-visible { border-color: #7dffb0; background: rgba(125, 255, 176, .1); }
  #menu .item.atual { border-color: rgba(255, 154, 86, .75); }
  #menu .item .tecla { flex: none; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; min-width: 36px; height: 36px; padding: 0 8px; border-radius: 8px;
    font: 700 15px/1 "Cascadia Mono", Consolas, monospace; color: #f4f7f9; background: linear-gradient(#3b4651, #262e37); border: 1px solid rgba(255, 255, 255, .17); border-bottom: 3px solid rgba(0, 0, 0, .5); }
  #menu .item b { display: block; font-weight: 600; font-size: 15.5px; }
  #menu .item .nota { display: block; color: #a9b8c2; font-size: 12.5px; line-height: 1.35; }
  #menu .item .agora { margin-left: 8px; font: 600 10px/1 Bahnschrift, "Segoe UI", sans-serif; letter-spacing: 1.2px; text-transform: uppercase; color: #ff9a56; }
  #menu .pe { margin: 10px 0 0; color: #93a4af; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  #menu .pe a { color: #7dffb0; text-decoration: none; }
  #menu .pe a:hover { text-decoration: underline; }
  /* a pílula que abre o menu, junto das outras (só nos desafios) */
  body.desafio #abrirMenu { all: unset; box-sizing: border-box; cursor: pointer; pointer-events: auto; padding: 8px 14px; border-radius: 999px; font: 600 13px/1 var(--texto); color: #c9d4db;
    background: var(--vidro); border: 1px solid var(--borda); box-shadow: 0 12px 32px rgba(0, 0, 0, .34), inset 0 1px 0 rgba(255, 255, 255, .07); -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3); transition: background .15s, color .15s; }
  body.desafio #abrirMenu:hover { background: var(--verde); color: #07130d; }
  body.desafio.bancada #abrirMenu { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07); text-align: center; }
  body.desafio.doca-lado #abrirMenu { flex: 1 1 auto; order: 3; }
</style>
</head>
<body>
<canvas id="tela"></canvas>

<!-- No modo voador e na visão por trás (jogo.js): o balão com o que a iA pretende, em cima da cabeça do robô. É da
     página, não do jogo: nunca entra na imagem que a iA recebe. -->
<div id="pensa" hidden></div>

<!-- A bancada de quem assiste. Nos desafios (jogo.js) é uma coluna ao lado da imagem ou uma faixa
     embaixo dela, e tudo o que é da página fica aqui, fora da imagem do jogo. Na quadra (arena.js)
     esta caixa não existe para o desenho da página: cada painel fica no canto que sempre teve. -->
<div id="doca">

<!-- O que a iA diz que pretende com cada botão, para quem assiste (jogo.js preenche). -->
<div id="quer" class="painel" hidden></div>

<!-- O que o jogo diz ao jogador no começo do desafio (jogo.js preenche). -->
<div id="mensagem" class="painel"></div>

<!-- Só quais botões existem: o jogo não diz o que cada botão faz.
     (As últimas linhas são da página, não do jogo: 1 a 9, V, M e Shift+T começam um desafio,
     C troca a visão de quem assiste, B troca o arranjo da página, I é o modo iA, R recomeça, H esconde
     esta lista, G abre os replays e Esc abre o menu dos jogos. Nos desafios M e T, arena.js troca esta lista pela dos dois jogadores.) -->
<div id="ajuda" class="painel">  W
A S D
Espaço Tab
L T F

1 2 3 4 5 6 7 8 9 V M C Shift+T
I R H G Esc</div>

<div id="pilulas">
<!-- O modo iA (tecla I): a imagem só muda quando a iA pede uma. -->
<div id="modo" class="painel" hidden>I</div>

<!-- O som dos desafios (jogo.js): os efeitos, a música do violeiro e a chuva. Um clique, ou a tecla O, liga e desliga; as duas réguas são o volume da música e o dos efeitos. -->
<div id="som" class="painel" hidden><button type="button" tabindex="-1" title="Liga e desliga o som do jogo: os efeitos, a música do violão e a chuva">som ligado</button><kbd>O</kbd><label title="O volume da música do violeiro da praça">violão <input type="range" min="0" max="100" step="1" tabindex="-1" data-som="musica"></label><label title="O volume dos efeitos: o que acontece no jogo, os bichos e a chuva">efeitos <input type="range" min="0" max="100" step="1" tabindex="-1" data-som="efeitos"></label></div>

<!-- Estado da ligação com o servidor MCP (ver ponte.js). Não aparece quando a página é aberta direto do arquivo. -->
<div id="ponte" class="painel" hidden></div>

<!-- A visão de quem assiste, nos desafios (jogo.js): a da iA, a de quem voa por fora e, só nas gravações dos desafios
     em que o robô joga sozinho, a que vai atrás dele (fora delas, jogo.js tira esse botão). -->
<div id="vista" class="painel" hidden><button type="button" tabindex="-1" data-vista="ia" title="O que o robô da iA está vendo">visão da iA</button><button type="button" tabindex="-1" data-vista="atras" title="A câmera vai atrás do robô, por cima do ombro dele, com o balão do que ele pretende em cima da cabeça; a roda do mouse afasta e aproxima">por trás</button><button type="button" tabindex="-1" data-vista="voador" title="Uma câmera solta, invisível: W A S D voam, Q e E descem e sobem, Shift corre, Z vai até o robô; um clique prende o mouse, que passa a virar a câmera, e Esc solta">voador</button><kbd>C</kbd></div>

<!-- O arranjo da página nos desafios (jogo.js): a imagem enchendo a janela, com os painéis por cima, ou a imagem com o menu ao lado. -->
<div id="arranjo" class="painel" hidden><button type="button" tabindex="-1" data-arranjo="cheia" title="A imagem do jogo enche a janela, e os painéis ficam por cima dela, nos cantos">tela cheia</button><button type="button" tabindex="-1" data-arranjo="lado" title="A imagem fica do tamanho da que a iA recebe, sem nada por cima, e os painéis vão para um menu ao lado">menu ao lado</button><kbd>B</kbd></div>

<!-- Abre o menu dos jogos (o mesmo que a tecla Esc): ver o script no fim da página. -->
<button id="abrirMenu" type="button" tabindex="-1" hidden title="A lista dos jogos: os desafios, a vila e o Galinha Pong (tecla Esc)">☰ jogos</button>

<!-- As partidas gravadas, em outra aba (ver gravacao.js e replays.html). Só com o servidor ligado. -->
<a id="replays" class="painel" href="replays.html" target="_blank" rel="noopener" title="As partidas gravadas, em outra aba (tecla G)">▶ replays</a>
</div>

</div>

<!-- Painel de depuração: mostra o que cada comando fez. Sem tecla; só aparece com ?depurar no endereço. -->
<div id="status" class="painel" hidden></div>
<div id="log" class="painel" hidden></div>

<div id="caixa" hidden>
  <input id="entrada" maxlength="10" autocomplete="off" spellcheck="false">
</div>

<script src="vendor/three.min.js"></script>
<script src="gravacao.js"></script>
<script src="jogo.js"></script>
<script src="arena.js"></script>
<script src="ponte.js"></script>

<!-- O menu dos jogos. Abre sozinho quando a página é aberta sem ?desafio= no endereço (é a "porta de
     entrada": quem abre a página sem saber o número de cada jogo escolhe aqui), e pela tecla Esc ou
     pela pílula "jogos". A iA não o vê: é da página, não entra na imagem dela. Quando uma iA aperta um
     botão, o menu sai da frente sozinho. -->
<div id="menu" hidden>
  <div class="quadro" role="dialog" aria-label="Jogos">
    <h1>Jogos</h1>
    <p class="dica">Clique num jogo ou aperte a tecla dele. Para uma iA jogar, peça a ela, por exemplo: "jogue o Desafio 8".</p>
    <div class="lista"></div>
    <p class="pe"><span><b>Esc</b> fecha este menu (e abre de novo)</span><a href="replays.html" target="_blank" rel="noopener">▶ replays das partidas gravadas</a></p>
  </div>
</div>
<script>
(() => {
  'use strict';
  // cada jogo: o que vai em ?desafio=, a tecla, o nome e uma linha para quem assiste lembrar o que é
  const JOGOS = [
    ['1', '1', 'Desafio 1', 'O quarto do espelho, sem instrução nenhuma'],
    ['2', '2', 'Desafio 2', 'O quarto do espelho: "Dê o objeto para o robô"'],
    ['3', '3', 'Desafio 3', 'Uma pessoa no quarto, e nenhuma instrução'],
    ['4', '4', 'Desafio 4', 'A cidade: a casa amarela e a pessoa com fome'],
    ['5', '5', 'Desafio 5', 'A cidade: o flat e a dor de cabeça'],
    ['6', '6', 'Desafio 6', 'A cidade: a casa azul, pão de queijo e café'],
    ['7', '7', 'Desafio 7', 'O quebra-cabeça de 9 peças, com pontuação'],
    ['8', '8', 'Desafio 8', 'Os zumbis: virar e atirar, com recorde'],
    ['9', '9', 'Desafio 9', 'Apocalipse zumbi: as missões do abrigo, em 10 níveis'],
    ['V', 'V', 'Vila coletiva', 'Até quatro iAs na cidade, cada uma com a sua missão'],
    ['M', 'M', 'Galinha Pong', 'Duas iAs, uma contra a outra, na quadra'],
    ['T', 'T', 'Treino de Galinha Pong', 'Uma iA contra o robô da casa'],
  ];
  const menu = document.getElementById('menu'), lista = menu.querySelector('.lista'), pilula = document.getElementById('abrirMenu');
  const endereco = new URLSearchParams(location.search), atual = endereco.get('desafio') || '1', assistindo = endereco.has('assistir');
  // Começa o jogo `id`: a página recarrega só com ele no endereço (o arranjo da página e o painel de depuração continuam como estavam).
  function ir(id) {
    try { sessionStorage.removeItem('quadra.entrada'); sessionStorage.removeItem('vila.entrada'); } catch (e) { }
    const p = new URLSearchParams();
    p.set('desafio', id);
    for (const k of ['painel', 'depurar']) if (endereco.has(k)) p.set(k, endereco.get(k));
    if ('?' + p.toString() === location.search) location.reload(); else location.search = p.toString();
  }
  for (const [id, tecla, nome, nota] of JOGOS) {
    const item = document.createElement('button'), marca = document.createElement('span'), corpo = document.createElement('span'), titulo = document.createElement('b'), linha = document.createElement('span');
    item.type = 'button';
    item.className = 'item' + (id === atual && !assistindo ? ' atual' : '');
    marca.className = 'tecla'; marca.textContent = tecla;
    titulo.textContent = nome;
    if (id === atual && !assistindo) { const agora = document.createElement('span'); agora.className = 'agora'; agora.textContent = 'aberto agora'; titulo.appendChild(agora); }
    linha.className = 'nota'; linha.textContent = nota;
    corpo.append(titulo, linha);
    item.append(marca, corpo);
    item.addEventListener('click', () => ir(id));
    lista.appendChild(item);
  }
  const aberto = () => !menu.hidden;
  const abrir = () => { menu.hidden = false; };
  const fechar = () => { menu.hidden = true; };
  menu.addEventListener('click', e => { if (e.target === menu) fechar(); });   // um clique fora do quadro fecha
  if (pilula && document.body.classList.contains('desafio')) { pilula.hidden = false; pilula.addEventListener('click', () => { pilula.blur(); abrir(); }); }
  // O teclado: Esc abre e fecha; com o menu aberto, a tecla de um jogo o começa, e nenhuma outra chega ao jogo que está atrás.
  window.addEventListener('keydown', e => {
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    const caixa = document.getElementById('caixa');
    if (e.code === 'Escape' && !(caixa && !caixa.hidden)) {      // (com a caixa de texto do botão T aberta, o Esc é dela)
      e.preventDefault(); e.stopImmediatePropagation();
      if (aberto()) fechar(); else abrir();
      return;
    }
    if (!aberto()) return;
    e.stopImmediatePropagation();
    const tecla = e.key.length === 1 ? e.key.toUpperCase() : '', jogo = JOGOS.find(j => j[1] === tecla);
    if (jogo && !e.repeat) { e.preventDefault(); ir(jogo[0]); }
    else if (e.code === 'Space' || e.code === 'Tab' || e.code.startsWith('Arrow')) e.preventDefault();
  }, true);
  // A iA que aperta um botão tira o menu da frente (ele taparia o jogo dela para quem assiste).
  const jogo = window.jogo;
  if (jogo && typeof jogo.apertar === 'function') {
    const apertar = jogo.apertar;
    jogo.apertar = function (...a) { if (Number.isInteger(a[2]) && a[2] > 0) fechar(); return apertar.apply(this, a); };
  }
  // a porta de entrada: a página aberta sem dizer o jogo (e sem ser para assistir a uma gravação)
  if (!endereco.has('desafio') && !assistindo) abrir();
  window.menuDosJogos = { abrir, fechar, get aberto() { return aberto(); } };
})();
</script>
<!-- O fim da página: é por ele que o navegador espera para desenhar (ver o link rel=expect, no alto). -->
<i id="pronta" hidden></i>
</body>
</html>
